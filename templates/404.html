{% load static %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="404 错误 - 页面未找到">
  <title>404 | 页面未找到</title>
  <script>
  (function(){try{var t=localStorage.getItem('oj-theme');
  if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
  document.documentElement.setAttribute('data-bs-theme',t);}catch(e){}})();
  </script>
  <link rel="stylesheet" href="{% static 'css/404.css' %}?v=20260926">
  <link rel="stylesheet" href="{% static 'css/oj-theme-v5b.css' %}?v=5b">
</head>
<body class="error-page">
  <div class="error-card" role="main" aria-labelledby="error-message-title">
    <div class="error-icon">
      🧭🔍
    </div>
    <div class="error-code" aria-label="404 错误代码">
      404
    </div>
    <div class="error-message" id="error-message-title">
      页面未找到
    </div>
    <p class="error-description">
      哎呀！你要找的页面似乎溜进了数字荒野。<br>
      它可能已被移动、重命名，或者从未存在过。
    </p>
    <div class="hint">
      <span>💡</span> 小贴士：检查网址是否输错，或返回首页重新开始
    </div>
    <div class="button-group">
      <a href="/" class="btn btn-primary">
        🏠 返回首页
      </a>
      <button class="btn btn-secondary" onclick="history.back();" type="button">
        ⟵ 返回上一页
      </button>
    </div>
  </div>
</body>
</html>

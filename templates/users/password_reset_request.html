{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}重置密码 - 谷物 OJ{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0"><i class="bi bi-key"></i> 重置密码</h5>
            </div>
            <div class="card-body">
                <p class="text-muted small">请输入你注册时使用的邮箱，我们将向你发送一个 6 位验证码用于重置密码。</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label">邮箱</label>
                        {{ form.email|as_crispy_field }}
                    </div>
                    <button type="submit" class="btn btn-info w-100">发送验证码</button>
                </form>
                <div class="mt-3 text-center">
                    <p class="mb-0"><a href="{% url 'login' %}">返回登录</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

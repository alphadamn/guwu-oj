{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}编辑资料 - 谷物 OJ{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-person-gear"></i> 编辑个人资料</h5>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">昵称</label>
                        {{ form.nickname|as_crispy_field }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">个人简介</label>
                        {{ form.bio|as_crispy_field }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">头像</label>
                        {{ form.avatar|as_crispy_field }}
                        {% if user.has_avatar %}
                            <div class="mt-2">
                                <img src="{{ user.avatar_url }}" class="rounded-circle" alt="Current avatar" style="width: 100px; height: 100px; object-fit: cover;">
                            </div>
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-primary">保存修改</button>
                    <a href="{% url 'profile' user.username %}" class="btn btn-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

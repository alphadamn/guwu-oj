{% extends "emails/_base_email.html" %}
{% block subject %}密码已成功重置 - {{ site_name }}{% endblock %}
{% block body %}
<p>{% if username %}<strong>{{ username }}</strong>，{% endif %}你好！</p>
<p>你在 <strong>{{ site_name }}</strong> 的账号密码已成功重置。你现在可以使用新密码登录。</p>

<div class="note">
  如果这不是你本人的操作，请立即修改密码并检查账号安全。
</div>

<p>—— {{ site_name }} 团队</p>
{% endblock %}

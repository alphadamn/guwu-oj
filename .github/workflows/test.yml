name: Django Tests

on:
  push:
    branches: [main, dev, dev*, feat/*]
  pull_request:
    branches: [main]

env:
  DJANGO_SECRET_KEY: ci-secret-key-not-for-production
  DJANGO_DEBUG: 'true'
  DB_NAME: ojdb
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: 127.0.0.1
  DB_PORT: 5432

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Start PostgreSQL
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=ojdb \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && break
            sleep 1
          done

      - name: Start Redis
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
          sudo sed -i 's/^bind .*/bind 127.0.0.1/' /etc/redis/redis.conf
          sudo redis-server --daemonize yes
          redis-cli ping

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: python -Wa manage.py test --verbosity=2

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check submissions/ --ignore E501,F401,F841 --exit-zero

name: Django Tests

on:
  push:
    branches: [main, dev, dev*, feat/*]
  pull_request:
    branches: [main]

env:
  DJANGO_SECRET_KEY: ci-secret-key-not-for-production
  DJANGO_DEBUG: 'true'
  DB_NAME: ojdb
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: 127.0.0.1
  DB_PORT: 5432

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start services
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql redis-server > /dev/null 2>&1
          sudo pg_ctlcluster 16 main start
          sleep 1
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb ojdb 2>/dev/null || true
          sudo redis-server --daemonize yes

      - name: Setup Python
        run: |
          python3 -m venv venv
          venv/bin/pip install -r requirements.txt -q 2>&1 | tail -3

      - name: Run migrations
        run: venv/bin/python manage.py migrate

      - name: Run tests
        run: venv/bin/python -Wa manage.py test --verbosity=2

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: |
          pip install ruff
          ruff check submissions/ --ignore E501,F401,F841 --exit-zero

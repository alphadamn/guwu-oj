name: Django Tests

on:
  push:
    branches: [main, dev, dev*, feat/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          USE_SQLITE: 'true'
          DJANGO_DEBUG: 'true'
          OJ_DOCKER_ENABLED: 'false'
        run: python manage.py migrate

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          USE_SQLITE: 'true'
          DJANGO_DEBUG: 'true'
          OJ_DOCKER_ENABLED: 'false'
        run: python -Wa manage.py test --verbosity=2

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check submissions/ --ignore E501,F401,F841 --exit-zero
